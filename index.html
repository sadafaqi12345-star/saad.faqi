<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAD FAQI - Luxury Currency Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #07090e 0%, #0f172a 50%, #07090e 100%);
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #38bdf8;
            --neon-purple: #818cf8;
            --neon-green: #10b981;
            --neon-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-info h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .brand-info p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .admin-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--neon-blue);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-btn:active {
            transform: scale(0.92);
        }

        .rates-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rate-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .rate-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px; height: 100%;
        }

        .rate-card.buy::before { background: var(--neon-green); }
        .rate-card.sell::before { background: var(--neon-rose); }

        .rate-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rate-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .rate-amount {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .rate-card.buy .rate-amount { color: var(--neon-green); }
        .rate-card.sell .rate-amount { color: var(--neon-rose); }

        .rate-icon-box {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .rate-card.buy .rate-icon-box {
            background: rgba(16, 185, 129, 0.1);
            color: var(--neon-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .rate-card.sell .rate-icon-box {
            background: rgba(244, 63, 94, 0.1);
            color: var(--neon-rose);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .calc-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .calc-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--neon-blue);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .currency-tag {
            position: absolute;
            left: 14px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 9, 14, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-content h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--neon-blue);
            text-align: center;
        }

        .modal-content input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            text-align: center;
            outline: none;
        }

        .modal-content input:focus {
            border-color: var(--neon-blue);
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-save { background: var(--neon-blue); color: #0f172a; }
        .btn-close { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        footer .creator {
            font-weight: 700;
            color: var(--neon-blue);
            font-size: 15px;
        }

        footer .phone {
            color: var(--text-main);
            font-weight: 600;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-info">
                <h1>SAAD FAQI</h1>
                <p>نرخی دراوەکان بە LIVE</p>
            </div>
            <div class="admin-btn" onclick="openAdminModal()">
                <i class="fa-solid fa-lock"></i>
            </div>
        </header>

        <div class="rates-container">
            <div class="rate-card buy">
                <div class="rate-details">
                    <span class="rate-title">نرخی کڕین (USD)</span>
                    <span class="rate-amount" id="displayBuy">150,250</span>
                </div>
                <div class="rate-icon-box">
                    <i class="fa-solid fa-arrow-down"></i>
                </div>
            </div>

            <div class="rate-card sell">
                <div class="rate-details">
                    <span class="rate-title">نرخی فرۆشتن (USD)</span>
                    <span class="rate-amount" id="displaySell">150,350</span>
                </div>
                <div class="rate-icon-box">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>
            </div>
        </div>

        <div class="calc-card">
            <div class="calc-title">
                <i class="fa-solid fa-calculator"></i> حاسیبەی خێرا
            </div>
            <div class="input-group">
                <label>بڕی دۆلار (USD)</label>
                <div class="input-wrapper">
                    <input type="number" id="usdInput" placeholder="بڕ بە دۆلار بنووسە..." oninput="calculate()">
                    <span class="currency-tag">$</span>
                </div>
            </div>
            <div class="input-group">
                <label>کۆی گشتی بە دینار (IQD)</label>
                <div class="input-wrapper">
                    <input type="text" id="iqdOutput" placeholder="0" readonly style="color: var(--neon-green);">
                    <span class="currency-tag">دینار</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>چوونەژوورەوەی ئادمین</h3>
            <input type="password" id="passcodeInput" placeholder="پاسۆرد بنووسە">
            <div class="modal-btns">
                <button class="btn-close" onclick="closeAdminModal()">داخستن</button>
                <button class="btn-save" onclick="checkPasscode()">چوونەژوورەوە</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>گۆڕینی نرخەکان</h3>
            <div class="input-group" style="margin-bottom:0;">
                <label>نرخی نوێی کڕین</label>
                <input type="number" id="newBuyInput">
            </div>
            <div class="input-group" style="margin-bottom:0;">
                <label>نرخی نوێی فرۆشتن</label>
                <input type="number" id="newSellInput">
            </div>
            <div class="modal-btns">
                <button class="btn-close" onclick="closeEditModal()">پاشگەزبوونەوە</button>
                <button class="btn-save" onclick="saveNewRates()">پاشەکەوتکردن</button>
            </div>
        </div>
    </div>

    <footer>
        <div>دیزاین کراوە لەلایەن</div>
        <div class="creator">سەعد فایەق (SAAD FAQI)</div>
        <div class="phone"><i class="fa-solid fa-phone"></i> 0750 123 4567</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">کوردستان - هەولێر</div>
    </footer>

    <script>
        let buyRate = localStorage.getItem('saad_buy') || 150250;
        let sellRate = localStorage.getItem('saad_sell') || 150350;

        document.getElementById('displayBuy').innerText = Number(buyRate).toLocaleString();
        document.getElementById('displaySell').innerText = Number(sellRate).toLocaleString();

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('passcodeInput').value = '';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkPasscode() {
            const pass = document.getElementById('passcodeInput').value;
            if(pass === '0309') {
                closeAdminModal();
                document.getElementById('newBuyInput').value = buyRate;
                document.getElementById('newSellInput').value = sellRate;
                document.getElementById('editModal').style.display = 'flex';
            } else {
                alert('پاسۆردی هەڵەیە!');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveNewRates() {
            const b = document.getElementById('newBuyInput').value;
            const s = document.getElementById('newSellInput').value;
            if(b && s) {
                buyRate = b;
                sellRate = s;
                localStorage.setItem('saad_buy', b);
                localStorage.setItem('saad_sell', s);
                document.getElementById('displayBuy').innerText = Number(b).toLocaleString();
                document.getElementById('displaySell').innerText = Number(s).toLocaleString();
                closeEditModal();
                calculate();
            }
        }

        function calculate() {
            const usd = document.getElementById('usdInput').value;
            if(usd === '' || isNaN(usd)) {
                document.getElementById('iqdOutput').value = '';
                return;
            }
            const total = usd * (Number(buyRate) / 100);
            document.getElementById('iqdOutput').value = Math.round(total).toLocaleString();
        }
    </script>
</body>
</html>
