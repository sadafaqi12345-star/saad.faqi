<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Saad Faqi - Currency Exchange</title>
    
    <!-- PWA & Mobile Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b132b">

    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-blue: #3a86ff;
            --text-white: #ffffff;
            --text-dim: #8d99ae;
            --green: #06d6a0;
            --border-color: #2a385b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-white); padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-img { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; }
        .logo-img img { width: 100%; height: 100%; object-fit: cover; }
        .title-box h1 { font-size: 1.1rem; letter-spacing: 1px; }
        .title-box p { font-size: 0.75rem; color: var(--text-dim); }

        .admin-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text-white); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .input-label { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 10px; display: block; }
        
        .amount-input-wrap { position: relative; display: flex; align-items: center; }
        .currency-symbol { position: absolute; right: 15px; font-size: 1.5rem; color: var(--accent-blue); font-weight: bold; }
        .amount-input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: #fff; font-size: 1.8rem; padding: 12px 45px 12px 15px; border-radius: 12px; text-align: left; direction: ltr; font-weight: bold; }
        
        .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .mode-btn { padding: 12px; border: none; border-radius: 10px; background: #0f172a; color: var(--text-dim); font-weight: bold; cursor: pointer; }
        .mode-btn.active { background: var(--accent-blue); color: #fff; }

        .rate-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .rate-row:last-child { border-bottom: none; }
        .provider-info { display: flex; align-items: center; gap: 10px; }
        .provider-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(58, 134, 255, 0.15); color: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
        .rate-val { color: var(--green); font-weight: bold; }
        .total-val { font-size: 1.1rem; font-weight: bold; text-align: left; direction: ltr; }

        /* Modal for Admin */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 350px; border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); }
        .modal h2 { font-size: 1.1rem; margin-bottom: 15px; }
        .modal input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
        .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-save { background: var(--accent-blue); color: #fff; }
        .btn-cancel { background: #334155; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-box" onclick="document.getElementById('logoInput').click()">
            <div class="logo-img" id="logoContainer">SF</div>
            <div class="title-box">
                <h1 id="appName">SAAD FAQI</h1>
                <p>نرخی ڕاستەوخۆی دراوەکان</p>
            </div>
            <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="uploadLogo(event)">
        </div>
        <button class="admin-btn" onclick="openAdmin()">دەستکاری (Admin)</button>
    </div>

    <div class="card">
        <label class="input-label">بڕی دۆلار ($):</label>
        <div class="amount-input-wrap">
            <span class="currency-symbol">$</span>
            <input type="number" id="usdAmount" class="amount-input" value="100" oninput="calculate()">
        </div>
    </div>

    <div class="mode-toggle">
        <button id="buyBtn" class="mode-btn active" onclick="setMode('buy')">کڕینی دۆلار</button>
        <button id="sellBtn" class="mode-btn" onclick="setMode('sell')">فۆشتنی دۆلار</button>
    </div>

    <div class="card">
        <div id="ratesList"></div>
    </div>

    <!-- Modal Admin Password & Edit -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>چوونەژوورەوەی بەڕێوەبەر</h2>
            <div id="authSection">
                <input type="password" id="adminPass" placeholder="وشەی نهێنی بنووسە...">
                <div class="modal-actions">
                    <button class="btn-save" onclick="verifyAdmin()">چوونەژوورەوە</button>
                    <button class="btn-cancel" onclick="closeAdmin()">داخستن</button>
                </div>
            </div>
            <div id="editSection" style="display:none;">
                <label style="font-size:0.8rem; color:var(--text-dim);">نرخی FIB:</label>
                <input type="number" id="editFib">
                <label style="font-size:0.8rem; color:var(--text-dim);">نرخی FastPay:</label>
                <input type="number" id="editFastPay">
                <label style="font-size:0.8rem; color:var(--text-dim);">نرخی ZainCash:</label>
                <input type="number" id="editZain">
                <div class="modal-actions">
                    <button class="btn-save" onclick="saveFirebaseData()">پاشەکەوتکردن بۆ هەمووان</button>
                    <button class="btn-cancel" onclick="closeAdmin()">داخستن</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://saad-rates-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let rates = { FIB: 1568, FastPay: 1584, ZainCash: 1580 };
        let currentMode = 'buy';
        const PASSWORD = "0309";

        // Read Live Data
        db.ref('rates').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                rates = data;
                calculate();
            }
        });

        function calculate() {
            const usd = parseFloat(document.getElementById('usdAmount').value) || 0;
            const container = document.getElementById('ratesList');
            container.innerHTML = '';

            Object.keys(rates).forEach(provider => {
                let rate = rates[provider];
                if(currentMode === 'sell') rate -= 5;

                const total = (usd * rate).toLocaleString();

                container.innerHTML += `
                    <div class="rate-row">
                        <div class="provider-info">
                            <div class="provider-icon">${provider.substring(0,2)}</div>
                            <div>
                                <div>${provider}</div>
                                <div class="rate-val">${rate.toLocaleString()} IQD</div>
                            </div>
                        </div>
                        <div class="total-val">${total} <span style="font-size:0.7rem; color:var(--text-dim)">IQD</span></div>
                    </div>
                `;
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('buyBtn').classList.toggle('active', mode === 'buy');
            document.getElementById('sellBtn').classList.toggle('active', mode === 'sell');
            calculate();
        }

        function openAdmin() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

        function verifyAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === PASSWORD) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('editSection').style.display = 'block';
                document.getElementById('editFib').value = rates.FIB || 1568;
                document.getElementById('editFastPay').value = rates.FastPay || 1584;
                document.getElementById('editZain').value = rates.ZainCash || 1580;
            } else {
                alert('وشەی نهێنی هەڵەیە!');
            }
        }

        function saveFirebaseData() {
            const newRates = {
                FIB: parseFloat(document.getElementById('editFib').value),
                FastPay: parseFloat(document.getElementById('editFastPay').value),
                ZainCash: parseFloat(document.getElementById('editZain').value)
            };
            
            db.ref('rates').set(newRates).then(() => {
                alert('نرخەکان بۆ هەموو بەکارهێنەران بە سەرکەوتوویی گوڕدران!');
                closeAdmin();
            });
        }

        function uploadLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('logoContainer').innerHTML = `<img src="${event.target.result}">`;
                    localStorage.setItem('userLogo', event.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        const savedLogo = localStorage.getItem('userLogo');
        if (savedLogo) {
            document.getElementById('logoContainer').innerHTML = `<img src="${savedLogo}">`;
        }

        calculate();
    </script>
</body>
</html>
